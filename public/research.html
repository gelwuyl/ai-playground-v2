<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr Kaypoh — Research Agent</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/story.css">
  <style>
    /* Word-wrap for the live trace, report, and eval — fit any screen width */
    #trace, #report, #eval, #progress {
      word-break: break-word;
      overflow-wrap: anywhere;
      min-width: 0;
    }
    #trace li {
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      border-radius: 12px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.75rem;
      list-style: none;
    }
    #trace li .q,
    #trace li .a,
    #trace li .meta {
      white-space: pre-wrap;      /* keep newlines AND wrap long lines */
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    #trace li .q { font-weight: 600; }
    #trace li .a { margin-top: 0.3rem; }
    #trace li .meta {
      margin-top: 0.35rem;
      font-size: 0.85rem;
      color: #52606d;
    }
    #report pre {
      white-space: pre-wrap;      /* wrap long URLs/text instead of horizontal scroll */
      overflow-wrap: anywhere;
      word-break: break-word;
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      border-radius: 12px;
      padding: 1rem;
      line-height: 1.6;
    }
    #report h2, #eval h2 { margin: 1.25rem 0 0.5rem; }
    #eval ul { list-style: none; padding-left: 0; }
    #eval li {
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      margin-bottom: 0.35rem;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    #eval li.pass { border-left: 4px solid #16a34a; }
    #eval li.fail { border-left: 4px solid #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="/">← Back to AI Playground</a>
    <h1>🔎 Mr Kaypoh</h1>
    <p class="subtitle">A research agent that searches, reads, and reports with sources.</p>

    <textarea id="query" rows="3" placeholder="Ask a research question needing current evidence…"></textarea>
    <button id="start-btn">Start Research</button>
    <div id="error"></div>

    <div id="progress"></div>
    <ol id="trace"></ol>
    <div id="report"></div>
    <div id="eval"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let sessionId = null;
    let timer = null;

    function escapeHtml(s) {
      return (s || "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function renderStep(s) {
      const li = document.createElement("li");
      const meta = s.url ? ` <span class="meta">${escapeHtml(s.url)}</span>` :
                   s.query ? ` <span class="meta">${escapeHtml(s.query)}</span>` : "";
      li.innerHTML = `<div class="q"><strong>STEP ${s.step_number} · ${escapeHtml(s.action)}</strong>${meta}</div>` +
                     `<div class="a">${escapeHtml(s.reason || "")}</div>` +
                     `<div class="meta">${escapeHtml(s.observation || "")}</div>`;
      $("trace").appendChild(li);
    }

    // Poll one step. Returns true if the loop should continue, false to stop.
    async function step() {
      const r = await fetch("/api/research_step", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sessionId}),
      });
      const data = await r.json();
      if (!r.ok) {
        $("error").textContent = data.detail || "Step failed.";
        return false;
      }
      renderStep(data.step);
      $("progress").textContent = `Pages read: ${data.pages_read} (${data.step_limit}-step limit).`;

      if (data.finished) {
        $("report").innerHTML = `<h2>Research Brief</h2><pre>${escapeHtml(data.step.report || "")}</pre>`;
        runEval();
        return false;
      }
      if (data.step.action === "REFUSED" && data.step.step_number > data.step_limit) {
        $("error").textContent = "Run ended: step limit reached without a valid report.";
        return false;
      }
      return true;
    }

    // Self-scheduling loop: only schedule the NEXT poll AFTER the current step
    // completes, so requests never overlap (prevents duplicate/raced steps).
    function pollLoop() {
      step().then((cont) => {
        if (cont) {
          timer = setTimeout(pollLoop, 1500);
        } else {
          $("start-btn").disabled = false;
        }
      });
    }

    async function runEval() {
      const r = await fetch("/api/research_eval", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sessionId}),
      });
      const data = await r.json();
      if (!r.ok) return;
      $("eval").innerHTML = `<h2>Evaluation: ${data.score}/${data.total}</h2><ul>` +
        data.checks.map(c => `<li class="${c.pass ? 'pass' : 'fail'}">${c.pass ? 'PASS' : 'FAIL'} — ${escapeHtml(c.name)}</li>`).join("") +
        `</ul>`;
    }

    $("start-btn").addEventListener("click", async () => {
      const q = $("query").value.trim();
      $("error").textContent = "";
      $("trace").innerHTML = "";
      $("report").innerHTML = "";
      $("eval").innerHTML = "";
      if (!q) { $("error").textContent = "Enter a question."; return; }

      const r = await fetch("/api/research_start", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({query: q}),
      });
      const data = await r.json();
      if (!r.ok) { $("error").textContent = data.detail || "Start failed."; return; }

      sessionId = data.session_id;
      $("progress").textContent = "Running…";
      $("start-btn").disabled = true;
      pollLoop();
    });
  </script>
</body>
</html>
