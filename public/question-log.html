<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Miss Chatterbox</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/story.css">
</head>
<body>
  <div class="container">
    <a class="back-link" href="/">← Back to AI Playground</a>
    <h1>💬 Little Miss Chatterbox</h1>
    <p class="subtitle">Ask anything and keep the conversation flowing.</p>

    <textarea id="question" rows="3" placeholder="Ask a question…"></textarea>
    <button id="ask-btn">Ask</button>
    <div id="error"></div>
    <div id="answer"></div>

    <h2>Recent</h2>
    <ol id="history"><li>No questions yet.</li></ol>
  </div>

  <script>
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[c]));
    }

    function renderHistory(items) {
      const list = document.getElementById("history");
      if (!items || items.length === 0) {
        list.innerHTML = "<li>No questions yet.</li>";
        return;
      }
      list.innerHTML = items.map(it =>
        `<li>
           <div class="card-header">
             <div class="q">${escapeHtml(it.question)}</div>
             <button class="item-delete-btn" onclick="deleteHistoryItem(${it.id})" title="Delete" aria-label="Delete">🗑️</button>
           </div>
           <div class="a">${escapeHtml(it.answer)}</div>
           <div class="meta">${escapeHtml(it.model_name)} · ${escapeHtml(it.created_at)}</div>
         </li>`
      ).join("");
    }

    async function deleteHistoryItem(id) {
      if (!window.confirm("Delete this interaction?")) return;
      try {
        const r = await fetch(`/api/history?id=${encodeURIComponent(id)}`, { method: "DELETE" });
        if (!r.ok) {
          const data = await r.json();
          throw new Error(data.detail || "Failed to delete");
        }
        await loadHistory();
      } catch (e) {
        alert(e.message);
      }
    }

    async function loadHistory() {
      const r = await fetch("/api/history");
      if (r.ok) renderHistory(await r.json());
    }

    document.getElementById("ask-btn").addEventListener("click", async () => {
      const q = document.getElementById("question").value;
      const errEl = document.getElementById("error");
      const ansEl = document.getElementById("answer");
      const btn = document.getElementById("ask-btn");
      errEl.textContent = "";
      ansEl.textContent = "Thinking…";
      btn.disabled = true;
      try {
        const r = await fetch("/api/ask", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({question: q}),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || "Request failed");
        ansEl.textContent = data.answer;
        renderHistory(data.history);
      } catch (e) {
        ansEl.textContent = "";
        errEl.textContent = e.message;
      } finally {
        btn.disabled = false;
      }
    });

    loadHistory();
  </script>
</body>
</html>
