<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Prep Crew - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal-bg { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .star-grid { display: grid; grid-template-columns: 100px 1fr; gap: 0.5rem; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white border-b p-6 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold">IP</div>
                <h1 class="text-xl font-bold">AI Playground <span class="text-slate-400 font-normal ml-2">/ Interview Prep</span></h1>
            </div>
            <button onclick="setView('landing')" class="text-xs text-red-500 font-medium hover:underline">Clear Session</button>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="flex-1 p-8"></main>
    </div>

    <script>
        async function setView(view) {
            const main = document.getElementById('main-content');
            if (view === 'landing') {
                main.innerHTML = `
                    <div class="max-w-2xl mx-auto bg-white p-8 rounded-3xl shadow-xl border border-slate-200 space-y-6">
                        <h2 class="text-3xl font-black text-center mb-6">Interview Intelligence</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold mb-1">Target Companies</label>
                                <input id="target_companies" type="text" placeholder="Google, NVIDIA, OpenAI" class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-1">Target Role</label>
                                <input id="target_role" type="text" placeholder="AI Product Manager" class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-1">Your Resume / CV</label>
                                <textarea id="user_resume" rows="4" placeholder="Paste your professional background here..." class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"></textarea>
                            </div>
                            <button id="start-btn" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-indigo-700 transition-all">Start Agent Crew</button>
                        </div>
                    </div>
                `;
                document.getElementById('start-btn').onclick = startCrew;
            } else if (view === 'processing') {
                main.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full space-y-8">
                        <div class="animate-spin rounded-full h-20 w-20 border-4 border-indigo-200 border-t-indigo-600"></div>
                        <h2 class="text-2xl font-bold text-slate-700" id="status-text">Agents are synthesizing your guide...</h2>
                        <div class="w-64 bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div id="progress-bar" class="bg-indigo-600 h-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                `;
            } else if (view === 'dossier') {
                main.innerHTML = `
                    <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Company cards injected here -->
                    </div>
                    <div id="modal" class="hidden fixed inset-0 modal-bg flex items-center justify-center p-4 z-50">
                        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                                <h2 id="modal-title" class="text-2xl font-black"></h2>
                                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
                            </div>
                            <div id="modal-body" class="p-8 overflow-y-auto space-y-6"></div>
                        </div>
                    </div>
                `;
            }
        }

        async function startCrew() {
            const body = {
                target_companies: document.getElementById('target_companies').value,
                target_role: document.getElementById('target_role').value,
                user_resume: document.getElementById('user_resume').value
            };

            if (!body.target_companies || !body.target_role || !body.user_resume) {
                alert("Please fill in all fields.");
                return;
            }

            setView('processing');
            try {
                // 1. Start Session
                const startRes = await fetch('/api/interview_start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const { session_id } = await startRes.json();

                // 2. Execute the 3 Phased Steps
                const steps = [
                    { name: 'Prospecting Roles', endpoint: '/api/interview_step' },
                    { name: 'Researching Questions', endpoint: '/api/interview_step' },
                    { name: 'Drafting Responses', endpoint: '/api/interview_step' }
                ];

                for (let i = 0; i < steps.length; i++) {
                    document.getElementById('status-text').innerText = steps[i].name + "...";
                    document.getElementById('progress-bar').style.width = ((i + 1) * 33.3) + '%';

                    await fetch(steps[i].endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id })
                    });
                }

                // 3. Fetch final guide and render
                const statusRes = await fetch(`/api/interview_status?session_id=${session_id}`);
                const statusData = await statusRes.json();

                renderDossier(statusData.final_guide);
                setView('dossier');

            } catch (e) {
                console.error(e);
                alert("An error occurred during crew execution.");
                setView('landing');
            }
        }

        function renderDossier(markdown) {
            // Extremely simple markdown-to-card parser for the prototype
            // In production, we'd use a library like marked.js
            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = '';

            // Split by "### **Company Name**"
            const sections = markdown.split(/### \*\*([^*]+)\*\*/);

            // Skip the first part (intro)
            for (let i = 1; i < sections.length; i += 2) {
                const company = sections[i];
                const content = sections[i+1];

                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-3xl shadow-sm border border-slate-200 cursor-pointer hover:shadow-xl hover:-translate-y-1 transition-all group";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="bg-indigo-100 text-indigo-700 p-2 rounded-lg font-bold text-xs uppercase tracking-tighter">Target</div>
                        <div class="text-slate-300 group-hover:text-indigo-500 transition-colors">➔</div>
                    </div>
                    <h3 class="text-2xl font-black text-slate-900 mb-1">${company}</h3>
                    <p class="text-sm text-slate-500 mb-6">AI-Generated Playbook</p>
                    <div class="flex items-center gap-2 text-indigo-600 text-xs font-bold">View Playbook <span class="text-slate-400">➔</span></div>
                `;
                card.onclick = () => openModal(company, content);
                grid.appendChild(card);
            }
        }

        function openModal(company, content) {
            document.getElementById('modal-title').innerText = company;
            // Simple formatting for the modal
            const formattedContent = content
                .replace(/#### \*\*The STAR Response:\*\*/g, '<div class="font-bold text-indigo-600 mb-2">STAR Response</div>')
                .replace(/\* \*\*Situation:\*\*/g, '<div class="font-bold text-xs text-slate-400 uppercase">Situation</div>')
                .replace(/\* \*\*Task:\*\*/g, '<div class="font-bold text-xs text-slate-400 uppercase mt-4">Task</div>')
                .replace(/\* \*\*Action:\*\*/g, '<div class="font-bold text-xs text-slate-400 uppercase mt-4">Action</div>')
                .replace(/\* \*\*Result:\*\*/g, '<div class="font-bold text-xs text-slate-400 uppercase mt-4">Result</div>')
                .replace(/> 💡 \*\*Critic's Note:\*\*/g, '<div class="mt-6 p-4 bg-amber-50 border-l-4 border-amber-400 rounded-r-xl text-sm italic text-amber-800"><strong>Coach:</strong>')
                .replace(/<\/div>$/, '</div>');

            document.getElementById('modal-body').innerHTML = `<div class="space-y-4 text-slate-700 leading-relaxed">${formattedContent}</div>`;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        setView('landing');
    </script>
</body>
</html>
